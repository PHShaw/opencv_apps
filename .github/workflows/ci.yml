name: ci

on: [push, pull_request]

jobs:
  build-and-test:
    name: Jazzy build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: opencv_apps
          target-ros2-distro: jazzy
          # Run the launch_testing smoke tests only (see "Testing" in README.md);
          # the ament linters don't match this package's ROS 1 code style
          colcon-defaults: |
            {
              "test": {
                "ctest-args": ["-R", "test_launch"]
              }
            }
